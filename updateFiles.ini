en = v1.0.4 Update Details:\n\n【New KJKv9 Binary Format】\n• New KJKv9 binary format: 64-byte header + 4MB AES-256-GCM blocks + encrypted directory\n• Byte-for-byte interop between the C desktop engine and WebCrypto in the browser\n• On-demand decryption in the web version: only the chunks you need are decrypted\n\n【Full-C Multi-Threaded Scheduler】\n• Page-based scheduling (thread pool / watchdog / OVERLAPPED I/O / progress callbacks) runs entirely inside the C engine -- zero Python overhead on the data path\n• Main-window batch encrypt / decrypt / append now use the C scheduler with live progress, no UI freeze\n\n【Standalone Package Browser】\n• New standalone directory-tree window (browse), opens independently from the main program\n• Windows Explorer-style gestures: hover highlight, auto-expand, drag-drop add, external drag in/out, right-click rename/delete\n• Single-entry on-demand decryption, dirty-flag save prompt, viewport-virtualized rendering (100,000-node expand/collapse in milliseconds)\n\n【Web Package Editor】\n• Open a KJKv9 package in the browser and delete / rename entries, change the password, or append files; the edited package is saved and the tree refreshed automatically\n\n【Context-Menu Enhancements】\n• Right-click encrypt/decrypt now runs in a background async window -- cancellable, with 0.1% progress\n• Background threads lowered to below-normal priority, reserving resources for other apps\n• New KJKv9 right-click encrypt / decrypt / append flows\n\n【C Engine + Plugin Architecture】\n• New kjkfast C engine: native-C token encoding/decoding for dramatic speedups on large files\n• Engine DLLs live in the engine/ plugin folder with versioned names; multiple generations coexist and the newest is auto-selected at runtime\n• Automatic fallback to NumPy-vectorized or pure-Python backend when no DLL/compiler is present\n\n【Direct .kjk File Experience】\n• Double-click a .kjk file to open the directory tree directly; enter the password to browse / extract\n• Directory and basic info load first; content is loaded lazily from disk (no UI freeze)\n• Password-aware dialogs, including legacy package password detection\n\n【Uninstaller Fix】\n• Fixed leftover files: now fully cleans program files, engine/ folder and registry entries\n• Registers a delayed cleanup batch when occupied files fail to delete\n\n【Compatibility】\n• Full backward compatibility: decrypt files from v1.0.1/v1.0.2/v1.0.3 (KJKv5/v7/v8 text formats)\n• Legacy packages can be browsed, decrypted and upgraded to KJKv9\n• API remains a strict superset: only /package/* management endpoints were added; existing endpoint contracts are unchanged
zh-HK = v1.0.4 更新詳情:\n\n【新格式 KJKv9 二進制】\n• 新增 KJKv9 二進制格式: 64B 頭 + 4MB AES-256-GCM 分塊 + 加密目錄\n• 桌面版 C 引擎與瀏覽器 WebCrypto 逐字節互通\n• 網頁版按需解密: 只解密預覽/下載所需嘅分塊\n\n【全 C 多線程調度】\n• 分頁調度（線程池 / 看門狗 / OVERLAPPED I/O / 進度回調）全部喺 C 引擎內完成 — 數據通路零 Python 開銷\n• 主窗口批處理加密/解密/追加全面接入 C 調度，實時進度、唔會卡界面\n\n【獨立套件瀏覽器】\n• 新增獨立目錄樹視窗（browse），可同主程式分離獨立打開\n• Windows 資源管理器式操作: 懸停高亮 / 自動展開 / 拖放添加 / 外部拖入拖出 / 右鍵重新命名及刪除\n• 單一條目按需解密、髒標記關閉提示、視口虛擬化渲染（十萬節點展開毫秒級）\n\n【網頁版套件編輯】\n• 瀏覽器打開 KJKv9 套件即可刪除/重新命名條目、修改密碼、追加檔案；編輯後自動儲存新套件並刷新目錄樹\n\n【右鍵菜單增強】\n• 右鍵加解密改為後台異步調度窗口，可取消、0.1% 精度進度\n• 後台線程降至低優先級，為其他程式預留系統資源\n• 新增 KJKv9 右鍵加密/解密/追加流程\n\n【C 加速引擎 + 插件化架構】\n• 新增 C 語言 kjkfast 加速引擎，token 編解碼達 C 級性能\n• 引擎 DLL 以版本化命名存放於 engine/ 插件資料夾，多代共存、運行時自動選用最新\n• 無編譯器/缺 DLL 自動回退 NumPy 向量化或純 Python 後端，功能完全一致\n\n【直接點擊 .kjk 體驗】\n• 雙擊 .kjk 檔直開目錄樹，輸入密碼即可瀏覽/提取\n• 先讀目錄同基本資訊，內容磁碟延遲載入，唔會卡界面\n• 密碼感知彈窗，並支援舊格式套件密碼識別\n\n【卸載程式修復】\n• 修復卸載殘留: 依家可以徹底清理程式檔案、engine/ 引擎資料夾同註冊表項\n• 佔用檔案刪除失敗時自動註冊延遲清理批次處理\n\n【兼容性】\n• 完全向後兼容 v1.0.1/v1.0.2/v1.0.3（KJKv5/v7/v8 文字格式）\n• 舊格式套件可瀏覽/解密/升級為 KJKv9\n• API 保持嚴格超集: 僅新增 /package/* 套件管理端點，舊端點契約不變
zh-CN = v1.0.4 更新详情:\n\n【新格式 KJKv9 二进制】\n• 新增KJKv9二进制格式:64B头 + 4MB AES-256-GCM分块 + 加密目录\n• 桌面版C引擎与浏览器WebCrypto逐字节互通\n• 网页版按需解密:只解密预览/下载所需的分块\n\n【全C多线程调度】\n• 分页调度(线程池/看门狗/OVERLAPPED I/O/进度回调)全部在C引擎内完成——数据通路零Python开销\n• 主窗口批处理加密/解密/追加全面接入C调度，实时进度、不卡界面\n\n【独立包浏览器】\n• 新增独立目录树窗口(browse)，可与主程序分离独立打开\n• Windows资源管理器式操作:悬停高亮/自动展开/拖放添加/外部拖入拖出/右键重命名删除\n• 单条目按需解密、脏标记关闭提示、视口虚拟化渲染(十万节点展开毫秒级)\n\n【网页版包编辑】\n• 浏览器打开KJKv9包即可删除/重命名条目、修改密码、追加文件;编辑后自动保存新包并刷新目录树\n\n【右键菜单增强】\n• 右键加解密改为后台异步调度窗口，可取消、0.1%精度进度\n• 后台线程降至低优先级，为其他程序预留系统资源\n• 新增KJKv9右键加密/解密/追加流程\n\n【C加速引擎 + 插件化架构】\n• 新增C语言kjkfast加速引擎，token编解码达C级性能\n• 引擎DLL以版本化命名存放于engine/插件文件夹，多代共存、运行时自动选用最新\n• 无编译器/缺DLL自动回退NumPy向量化或纯Python后端，功能完全一致\n\n【直接点击.kjk体验】\n• 双击.kjk文件直开目录树，输入密码即可浏览/提取\n• 先读目录与基本信息，内容磁盘延迟加载，不卡界面\n• 密码感知弹窗，并支持旧格式包密码识别\n\n【卸载器修复】\n• 修复卸载残留:现可彻底清理程序文件、engine/引擎文件夹与注册表项\n• 占用文件删除失败时自动注册延迟清理批处理\n\n【兼容性】\n• 完全向后兼容v1.0.1/v1.0.2/v1.0.3(KJKv5/v7/v8文本格式)\n• 旧格式包可浏览/解密/升级为KJKv9\n• API保持严格超集:仅新增/package/*包管理端点，旧端点契约不变