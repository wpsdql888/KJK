en = v1.1.0 Update Details:\n\n【Selectable Encryption Algorithm】\n• Encrypt page now lets you choose the output algorithm:\n  - KJKv9 (binary .kjk): binary format cannot be copied, forces save/download of a single .kjk file\n  - Legacy text: outputs displayable, copyable and pasteable ciphertext\n• Web version: KJKv9 auto-downloads the .kjk file (copy button hidden); Legacy text shows a copyable ciphertext\n\n【Fixes & Improvements】\n• Fixed web 'Cannot read properties of undefined (reading substring)' when encrypting larger files with the legacy algorithm\n• Desktop: decrypting pure text now outputs only the plaintext (no ------- name (size B) ------- envelope); only file/package results open the package manager\n• Desktop package-manager scroll wheel now works correctly\n\n【Compatibility】\n• Fully backward compatible with v1.0.1 / v1.0.2 / v1.0.3 / v1.0.4 (all KJK formats)
zh-HK = v1.1.0 更新詳情:\n\n【可選加密演算法】\n• 加密頁可以揀輸出演算法:\n  - KJKv9（二進制 .kjk）：二進制無法複製，強制另存/下載一個 .kjk 檔\n  - 舊版本文本：輸出可顯示、可複製、可貼上的密文\n• 網頁版：揀 KJKv9 後加密完成自動下載 .kjk（隱藏複製掣）；揀舊版本文本則顯示可複製密文\n\n【修復與改進】\n• 修復網頁版舊演算法加密較大檔案時 'Cannot read properties of undefined (reading substring)' 報錯\n• 桌面版：解密純文字只輸出明文本身（移除 ------- 名稱 (大小 B) ------- 包絡）；只有檔案/套件結果先至打開包管理器\n• 桌面版包管理器滾輪操作恢復正常\n\n【兼容性】\n• 完全向後兼容 v1.0.1 / v1.0.2 / v1.0.3 / v1.0.4（全部 KJK 格式）
zh-CN = v1.1.0 更新详情:\n\n【可选加密算法】\n• 加密页可选择输出算法:\n  - KJKv9(二进制 .kjk):二进制无法复制,强制另存/下载单个 .kjk 文件\n  - 旧版本文本:输出可显示、可复制、可粘贴的密文\n• 网页版:选 KJKv9 后加密完成自动下载 .kjk(隐藏复制按钮);选旧版本文本则显示可复制密文\n\n【修复与改进】\n• 修复网页版旧算法加密较大文件时 'Cannot read properties of undefined (reading substring)' 报错\n• 桌面版:解密纯文本只输出明文本身(移除 -------- 名称 (大小 B) -------- 包络);只有文件/包结果才打开包管理器\n• 桌面版包管理器滚轮操作恢复正常\n\n【兼容性】\n• 完全向后兼容 v1.0.1 / v1.0.2 / v1.0.3 / v1.0.4(全部 KJK 格式)